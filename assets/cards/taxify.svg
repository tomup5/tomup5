<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220" viewBox="0 0 440 220" role="img" aria-label="Taxify">
<title>Taxify</title>
<defs>
<linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
<radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(40 0) scale(340 200)"><stop offset="0" stop-color="#1e3a8a" stop-opacity="0.55"/><stop offset="1" stop-color="#1e3a8a" stop-opacity="0"/></radialGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#06b6d4" stop-opacity="0"/><stop offset="0.5" stop-color="#06b6d4" stop-opacity="0.9"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect width="440" height="220" rx="16"/></clipPath>
</defs>
<g clip-path="url(#clip)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
<rect width="440" height="220" fill="#0b1220"/>
<rect width="440" height="220" fill="url(#glow)"/>
<rect x="-160" y="217" width="160" height="3" fill="url(#shine)"><animate attributeName="x" from="-160" to="440" dur="4s" repeatCount="indefinite"/></rect>
<rect x="0" y="0" width="5" height="220" fill="url(#bar)"/>
<text x="26" y="46" font-size="22" font-weight="700" fill="#ffffff">Taxify</text>
<rect x="26" y="62" width="96" height="22" rx="11" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-width="1"/>
<text x="74" y="77" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="0.6" fill="#22d3ee">51 TESTS ✓</text>
<text font-size="13" fill="#cbd5e1"><tspan x="26" y="110">Ride-hailing and scooter-rental sim, built with a teammate</tspan><tspan x="26" y="129">in Madrid. Seeded tests check no rider is double-booked.</tspan></text>
<rect x="26" y="148" width="69" height="22" rx="11" fill="#ED8B00"/><text x="60.5" y="163" text-anchor="middle" font-size="11.5" font-weight="600" fill="#fff">Java 17</text><rect x="103" y="148" width="69" height="22" rx="11" fill="#25A162"/><text x="137.5" y="163" text-anchor="middle" font-size="11.5" font-weight="600" fill="#fff">JUnit 5</text><rect x="180" y="148" width="62" height="22" rx="11" fill="#209BC4"/><text x="211" y="163" text-anchor="middle" font-size="11.5" font-weight="600" fill="#fff">Gradle</text><rect x="250" y="148" width="117" height="22" rx="11" fill="#2088FF"/><text x="308.5" y="163" text-anchor="middle" font-size="11.5" font-weight="600" fill="#fff">GitHub Actions</text>
</g>
<rect x="1" y="1" width="438" height="218" rx="15" fill="none" stroke="url(#border)" stroke-width="2"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="3s" repeatCount="indefinite"/></rect>
</svg>
