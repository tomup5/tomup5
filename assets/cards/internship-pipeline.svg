<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220" viewBox="0 0 440 220" role="img" aria-label="Internship Pipeline">
<title>Internship Pipeline</title>
<defs>
<linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
<radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(40 0) scale(340 200)"><stop offset="0" stop-color="#1e3a8a" stop-opacity="0.55"/><stop offset="1" stop-color="#1e3a8a" stop-opacity="0"/></radialGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#06b6d4" stop-opacity="0"/><stop offset="0.5" stop-color="#06b6d4" stop-opacity="0.9"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect width="440" height="220" rx="16"/></clipPath>
</defs>
<g clip-path="url(#clip)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
<rect width="440" height="220" fill="#0b1220"/>
<rect width="440" height="220" fill="url(#glow)"/>
<rect x="-160" y="217" width="160" height="3" fill="url(#shine)"><animate attributeName="x" from="-160" to="440" dur="4s" repeatCount="indefinite"/></rect>
<rect x="0" y="0" width="5" height="220" fill="url(#bar)"/>
<text x="26" y="46" font-size="22" font-weight="700" fill="#ffffff">Internship Pipeline</text>
<rect x="26" y="62" width="167" height="22" rx="11" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-width="1"/>
<text x="109.5" y="77" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="0.6" fill="#22d3ee">HUMAN-IN-THE-LOOP AI</text>
<text font-size="13" fill="#cbd5e1"><tspan x="26" y="110">Local assistant that finds, tailors, and prepares</tspan><tspan x="26" y="129">internship applications, with a human approving each step.</tspan></text>
<rect x="26" y="148" width="62" height="22" rx="11" fill="#3776AB"/><text x="57" y="163" text-anchor="middle" font-size="11.5" font-weight="600" fill="#fff">Python</text><rect x="96" y="148" width="69" height="22" rx="11" fill="#6BA539"/><text x="130.5" y="163" text-anchor="middle" font-size="11.5" font-weight="600" fill="#fff">Alembic</text><rect x="173" y="148" width="62" height="22" rx="11" fill="#0A9EDC"/><text x="204" y="163" text-anchor="middle" font-size="11.5" font-weight="600" fill="#fff">pytest</text><rect x="243" y="148" width="89" height="22" rx="11" fill="#FAB040"/><text x="287.5" y="163" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111">pre-commit</text><rect x="26" y="178" width="117" height="22" rx="11" fill="#2088FF"/><text x="84.5" y="193" text-anchor="middle" font-size="11.5" font-weight="600" fill="#fff">GitHub Actions</text>
</g>
<rect x="1" y="1" width="438" height="218" rx="15" fill="none" stroke="url(#border)" stroke-width="2"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="3s" repeatCount="indefinite"/></rect>
</svg>
